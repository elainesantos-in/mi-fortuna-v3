# docker-compose.yml
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: mifortuna
    ports:
      # 5433 no host é disputada pelo serviço nativo postgresql-x64-18 do Windows
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend/mifortuna-back
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend/mifortuna-front
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres-data:
